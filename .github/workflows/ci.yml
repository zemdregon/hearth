name: Verify Hearth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:inventory:d1
      - run: npm run test:inventory:api:d1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_MANAGED_BROWSER: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
